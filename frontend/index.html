<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Sistem Kwitansi Klinik Gigi Manda</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <main class="login-card">
    <div class="login-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5.5c-1.6-1.2-3.2-1.7-4.6-1.3C5.5 4.7 4.5 6.6 4.5 9c0 2 .4 3.6.9 5.3.5 1.7.8 3 1 4 .2 1 .8 1.7 1.6 1.7.9 0 1.3-.7 1.6-2 .3-1.2.5-2.4 2.4-2.4s2.1 1.2 2.4 2.4c.3 1.3.7 2 1.6 2 .8 0 1.4-.7 1.6-1.7.2-1 .5-2.3 1-4 .5-1.7.9-3.3.9-5.3 0-2.4-1-4.3-2.9-4.8-1.4-.4-3 .1-4.6 1.3Z"/>
      </svg>
    </div>

    <h1>Sistem Kwitansi</h1>
    <p class="sub" id="clinicName">Klinik Gigi Manda</p>

    <div class="alert" data-form-alert role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username <span class="req">*</span></label>
        <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        <div class="err"></div>
      </div>

      <div class="field">
        <label for="password">Password <span class="req">*</span></label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <div class="err"></div>
      </div>

      <button type="submit" class="btn-primary btn-block btn-lg" id="submitBtn">Masuk</button>
    </form>

    <div class="login-hint" id="firstRunHint">
      Login pertama kali? Gunakan akun bawaan <strong>admin</strong> /
      <strong>admin123</strong>, lalu segera ganti passwordnya di menu Pengaturan.
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
